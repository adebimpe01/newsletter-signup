<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWSLETTER-SIGNUP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./fontawesome-assets/css/all.min.css">
</head>
<body>
  <div class="signup-container">
        <div class="icon-container">
            <i class="far fa-envelope-open"></i>
        </div>
            <h2>Join Our Newsletter</h2>
            <p>Get the latest updates and coding tips straight to your inbox</p>

        <form id="signupForm">
            <div class="input-group">
                <i class="far fa-envelope"></i>
                <input type="email" required placeholder="Enter your email">
            </div>
            <button type="submit">Subscribe <i class="fas fa-arrow-right"></i></button>
        </form>

        <div class="benefits">
            <p class="benefit-item">
                <i class="fas fa-check"></i> Weekly coding tips
            </p>
            <p class="benefit-item">
                <i class="fas fa-check"></i> No spam, unsubscribe anytime
            </p>
        </div>
        <!-- MODAL -->
       <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>🎉 Thank You!</h3>
                <p>You’ve successfully subscribed to our newsletter.</p>
            </div>
        </div>
  </div>

 


  <script src="script.js"></script>
</body>
</html>
